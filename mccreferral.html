<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refer a friend | MCC</title>
<style>
  :root{
    --bg:#FBF6FA; --card:#FFFFFF; --ink:#1F1B24; --muted:#6E6676; --line:#EEE4EC;
    --brand:#9F2089; --brand-2:#C2369F; --brand-soft:#F7E6F3; --on-brand:#FFFFFF; --ok:#1E7D45;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141016; --card:#1F1922; --ink:#F4EFF6; --muted:#B3A9B8; --line:#33293A;
      --brand:#D45BC0; --brand-2:#B93FA3; --brand-soft:#2E1E2C; --on-brand:#FFFFFF; --ok:#62D393;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    -webkit-font-smoothing:antialiased}
  main{max-width:420px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}

  .hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--on-brand);
    border-radius:20px;padding:24px 20px 72px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,.12)}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
  h1{font-size:26px;line-height:1.2;margin:14px 0 6px;letter-spacing:-.01em}
  .hero p{margin:0;opacity:.92;font-size:15px}

  .linkcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    margin:-52px 8px 20px;position:relative;box-shadow:0 10px 28px rgba(80,20,70,.12)}
  .label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .link{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--brand-soft);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all;font-family:ui-monospace,Menlo,monospace}
  .copy{appearance:none;border:0;width:100%;margin-top:12px;min-height:52px;border-radius:14px;
    background:var(--brand);color:var(--on-brand);font:inherit;font-size:17px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
  .copy:active{transform:scale(.98)}
  .copy.done{background:var(--ok)}
  .copy:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .copy svg{width:20px;height:20px}

  .points{display:grid;gap:10px;margin:0 8px}
  .point{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px}
  .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);
    display:grid;place-items:center;font-size:18px}
  .point b{display:block;font-size:15px}
  .point span{font-size:13px;color:var(--muted)}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<main>
  <section class="hero">
    <span class="tag">Refer a friend</span>
    <h1>Apno ko bhi kamaana sikhao</h1>
    <p>Link copy karo aur kisi ke saath bhi share karo</p>
  </section>

  <section class="linkcard" aria-label="Your MCC sign-up link">
    <div class="label">Aapka MCC sign-up link</div>
    <div class="link" id="link"></div>
    <button class="copy" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copyText">Link copy karo</span>
    </button>
  </section>

  <section class="points" aria-label="Why join MCC">
    <div class="point"><div class="ic">0</div><div><b>Koi follower requirement nahi</b></div></div>
    <div class="point"><div class="ic">↺</div><div><b>Unlimited return</b></div></div>
    <div class="point"><div class="ic">₹</div><div><b>Product sales par commission</b></div></div>
  </section>

  <p class="foot">Meesho Creator Club</p>
</main>

<script>
  // ===== CONFIG: paste your MCC sign-up link here =====
  var SIGNUP_LINK = "https://affiliate.meesho.com/login?utm_source=branref_exp";

  // If the banner opens this page as ...?ref=<creator_id>, the id is added to the link
  // so each sign-up can be traced back to the creator who shared it.
  var link = SIGNUP_LINK;
  try{
    var ref = new URLSearchParams(location.search).get("ref");
    if(ref){ link += (link.indexOf("?") > -1 ? "&" : "?") + "utm_content=" + encodeURIComponent(ref); }
  }catch(e){}
  document.getElementById("link").textContent = link;

  var btn = document.getElementById("copyBtn"), txt = document.getElementById("copyText");
  function done(){
    btn.classList.add("done"); txt.textContent = "Copy ho gaya ✓";
    setTimeout(function(){ btn.classList.remove("done"); txt.textContent = "Link copy karo"; }, 2500);
  }
  function fail(){ txt.textContent = "Link ko dabake copy karo"; }
  function fallbackCopy(){
    var ta = document.createElement("textarea");
    ta.value = link; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); return ok;
  }
  btn.addEventListener("click", function(){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(link).then(done, function(){ fallbackCopy() ? done() : fail(); });
    } else { fallbackCopy() ? done() : fail(); }
  });
</script>
</body>
</html>
